name: agent-support

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mock-business:
    build:
      context: ./services/mock-business
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    logging: *default-logging
    environment:
      MOCK_BUSINESS_INTERNAL_TOKEN: ${APP_BUSINESS_INTERNAL_TOKEN:-dev-internal-token}
    expose:
      - "8010"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: ./services/api
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENVIRONMENT: production
      APP_DATABASE_PATH: /data/agent-support.db
      APP_DEFAULT_USER_ID: ${APP_DEFAULT_USER_ID:-demo-user}
      APP_STREAM_CHARACTER_DELAY: ${APP_STREAM_CHARACTER_DELAY:-0.018}
      APP_BUSINESS_BASE_URL: http://mock-business:8010
      APP_BUSINESS_INTERNAL_TOKEN: ${APP_BUSINESS_INTERNAL_TOKEN:-dev-internal-token}
      APP_BUSINESS_TIMEOUT_SECONDS: ${APP_BUSINESS_TIMEOUT_SECONDS:-3}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-30}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-2}
      MODEL_TEMPERATURE: ${MODEL_TEMPERATURE:-0.2}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-600}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-6}
      MEMORY_RECENT_MESSAGE_LIMIT: ${MEMORY_RECENT_MESSAGE_LIMIT:-6}
      MEMORY_SUMMARY_MAX_CHARS: ${MEMORY_SUMMARY_MAX_CHARS:-1600}
      MEMORY_MAX_LONG_TERM_ITEMS: ${MEMORY_MAX_LONG_TERM_ITEMS:-12}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - api-data:/data
    expose:
      - "8000"
    depends_on:
      mock-business:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - backend

  web:
    build:
      context: ./apps/web
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

volumes:
  api-data:

networks:
  backend:
    driver: bridge
