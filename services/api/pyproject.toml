[project]
name = "agent-support-api"
version = "0.1.0"
description = "FastAPI SSE backend for the public umbrella AI support demo"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0,<1",
  "fastapi>=0.115.0,<1",
  "httpx>=0.28.0,<1",
  "langgraph>=1.0.0,<2",
  "pydantic>=2.10.0,<3",
  "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
